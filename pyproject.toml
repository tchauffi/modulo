[project]
name = "modulo"
version = "0.1.0"
description = "Ikea dressing creator that help making PAX real custom furniture"
readme = "README.md"
authors = [
    { name = "Thibaut CHAUFFIER", email = "tchauffi@gmail.com" },
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
modulo = "modulo:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
